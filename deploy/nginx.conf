# Nginx site for running without Docker (LXC, VM or bare metal).
# Debian/Ubuntu: copy to /etc/nginx/sites-available/default and adjust the
# PHP-FPM socket to your PHP version (ls /run/php/).
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # Settings saved by the management UI are not meant to be downloaded
    location = /config.json {
        deny all;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
