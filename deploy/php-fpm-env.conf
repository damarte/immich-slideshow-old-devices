; Environment for PHP-FPM when running without Docker.
; PHP-FPM clears the environment by default (clear_env = yes), so the
; variables the app reads with getenv() must be declared on the pool.
;
; Append these lines to the [www] pool, e.g.
;   /etc/php/8.4/fpm/pool.d/www.conf
; then check and restart:
;   php-fpm8.4 -t && systemctl restart php8.4-fpm
;
; Use env[NAME] = "value" (not NAME=value) and keep values quoted:
; an unquoted # or ; starts a comment.

env[IMMICH_URL] = "http://your-immich-server:2283"
env[IMMICH_API_KEY] = "your_api_key"
env[ALBUM_ID] = "your_album_id"
env[CAROUSEL_DURATION] = "5"
env[BACKGROUND_COLOR] = "#000000"
env[RANDOM_ORDER] = "false"
env[STATUS_BAR_STYLE] = "black-translucent"
env[IMAGES_ORIENTATION] = "all"
env[CROP_TO_SCREEN] = "true"
env[IMAGE_QUALITY] = "preview"
env[TRANSITION_SECONDS] = "1"
env[SHOW_INFO] = "false"
; Optional: show photos only between these hours, black screen outside.
; Empty means always on. Note: the backlight stays on.
; env[ACTIVE_HOURS] = "07:00-23:00"
